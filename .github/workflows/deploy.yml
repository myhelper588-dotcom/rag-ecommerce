# ── 4. Deploy via SSM (pas de port 22 !) ─────────────────
      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["cd /home/ubuntu/rag-ecommerce && git pull origin main && docker compose down && docker compose build --no-cache && docker compose up -d && sleep 10 && curl -f http://localhost:8000/health || echo WARNING"]' \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "SSM Command ID: $COMMAND_ID"

      # ── 5. Vérifier le résultat ───────────────────────────────
      - name: Check SSM command result
        run: |
          sleep 40
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text